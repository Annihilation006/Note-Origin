name: note_origin
description: 记账 + 日历笔记 + AI 助手，一套代码跑安卓/iOS/鸿蒙/桌面
publish_to: 'none'

version: 0.3.1+4

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 状态管理，够用了不想上 riverpod
  provider: ^6.1.2
  # 本地库。安卓/iOS走sqflite，桌面端在main里切ffi实现
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  # 设置类的kv存储
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  http: ^1.2.2
  fl_chart: ^0.69.0
  dynamic_color: ^1.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

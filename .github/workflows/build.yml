name: Build Note Origin APK

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git python3-dev ffmpeg \
          libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
          libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev \
          zlib1g-dev libgstreamer1.0-dev libunwind-dev unzip wget curl jq

    - name: Setup Swiftly
      run: |
        curl -L -O https://download.swift.org/swiftly/linux/swiftly-x86_64.tar.gz
        tar zxf swiftly-x86_64.tar.gz
        ./swiftly init --quiet-shell-followup --no-modify-profile
        echo "$HOME/.local/bin" >> $GITHUB_PATH
        echo "$HOME/.local/share/swiftly/bin" >> $GITHUB_PATH

    - name: Build Swift Core (Manual SDK/NDK Link)
      run: |
        # 1. 環境加載
        export PATH="$HOME/.local/bin:$PATH"
        source "$HOME/.local/share/swiftly/env.sh"
        swiftly install latest --assume-yes

        # 2. 下載並解壓 SDK (手動接管)
        wget -q https://download.swift.org/swift-6.3-branch/android-sdk/swift-6.3-DEVELOPMENT-SNAPSHOT-2026-01-03-a/swift-6.3-DEVELOPMENT-SNAPSHOT-2026-01-03-a_android.artifactbundle.tar.gz
        mkdir -p sdk-temp
        tar -zxf swift-6.3-DEVELOPMENT-SNAPSHOT-2026-01-03-a_android.artifactbundle.tar.gz -C sdk-temp
        
        # 3. 【關鍵修正】精準定位 REAL_SDK_PATH
        # 我們尋找包含 usr/lib/swift/android 的目錄
        REAL_SDK_PATH=$(find $PWD/sdk-temp -type d -path "*/usr/lib/swift/android" | sed 's|/usr/lib/swift/android||' | head -n 1)
        SETUP_SCRIPT=$(find $PWD/sdk-temp -name "setup-android-sdk.sh" | head -n 1)
        
        echo "REAL_SDK_PATH: $REAL_SDK_PATH"
        echo "SETUP_SCRIPT: $SETUP_SCRIPT"

        # 4. 鏈接 NDK (使用 GitHub 內建的 NDK 避免下載)
        # NDK 27 已經預裝在 GitHub Runner 中
        chmod +x "$SETUP_SCRIPT"
        bash "$SETUP_SCRIPT" "$ANDROID_NDK_LATEST_HOME"

        # 5. 強制編譯
        swiftc -emit-library \
          -target aarch64-unknown-linux-android31 \
          -sdk "$REAL_SDK_PATH" \
          -I "$REAL_SDK_PATH/usr/lib/swift/android" \
          -L "$REAL_SDK_PATH/usr/lib/swift/android/aarch64" \
          core/Logic.swift \
          -o liblogic.so
        
        # 6. 提取庫文件
        SWIFT_LIB="$REAL_SDK_PATH/usr/lib/swift/android/aarch64"
        cp $SWIFT_LIB/libswiftCore.so .
        cp $SWIFT_LIB/libswiftGlibc.so .
        cp $SWIFT_LIB/libswiftDispatch.so .
        cp $SWIFT_LIB/libswift_Concurrency.so .
        cp $SWIFT_LIB/libFoundation.so .
        
        echo "Successfully built liblogic.so!"

    - name: Build with Buildozer
      run: |
        pip install --user --upgrade buildozer cython
        export PATH=$PATH:$HOME/.local/bin
        yes | buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: NoteOrigin-Debug-APK
        path: bin/*.apk

name: Build Note Origin APK

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Swiftly (Official 2026 Method)
      run: |
        # 获取架构（ubuntu-22.04 是 x86_64）
        ARCH=$(uname -m)
        
        # 直接下载官方静态 Linux swiftly 二进制包（永久链接）
        curl -O https://download.swift.org/swiftly/linux/swiftly-$ARCH.tar.gz
        
        # 解压并初始化（quiet 模式避免任何交互）
        tar zxf swiftly-$ARCH.tar.gz
        ./swiftly init --quiet-shell-followup
        
        # 添加到 PATH（swiftly 会放在 ~/.local/share/swiftly）
        echo "$HOME/.local/bin" >> $GITHUB_PATH
        echo "$HOME/.local/share/swiftly/bin" >> $GITHUB_PATH
        
        # 安装最新稳定主机工具链（会自动拉取当前最新，如 6.2+）
        swiftly install latest --quiet

    - name: Install Android Swift SDK (6.3 Preview Nightly)
      run: |
        # 安装最新 6.3 分支 nightly snapshot（2026 年官方推荐，包含完整 Android 支持）
        swiftly install release/6.3-snapshot --quiet
        
        # 或者用 main-snapshot 获取最前沿的 daily build
        # swiftly install main-snapshot --quiet

    - name: Build Swift Kernel (liblogic.so)
      run: |
        # 获取 Android SDK ID（通常以 android 开头）
        SDK_ID=$(swift sdk list | grep android | head -n 1 | awk '{print $1}')
        echo "Using Android SDK: $SDK_ID"
        
        if [ -z "$SDK_ID" ]; then
          echo "::error ::No Android SDK detected! Installation may have failed."
          swift sdk list
          exit 1
        fi

        # 编译共享库
        swiftc -emit-library -target aarch64-unknown-linux-android31 -swift-sdk $SDK_ID core/Logic.swift -o liblogic.so

        # 动态获取并拷贝运行时库（绝对稳）
        SWIFT_LIB=$(swift --print-target-info --swift-sdk $SDK_ID | jq -r '.paths.runtimeLibraryPaths[0]')/aarch64
        echo "Runtime lib path: $SWIFT_LIB"

        cp $SWIFT_LIB/libswiftCore.so .
        cp $SWIFT_LIB/libswiftGlibc.so .
        cp $SWIFT_LIB/libswiftDispatch.so .
        cp $SWIFT_LIB/libswift_Concurrency.so .
        cp $SWIFT_LIB/libFoundation.so .

        echo "Swift 内核与所有运行库准备完毕"

    - name: Install Buildozer Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-pip build-essential git python3-dev ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev libgstreamer1.0-dev openjdk-17-jdk-headless jq
        pip install --user --upgrade buildozer cython

    - name: Build with Buildozer
      run: |
        export PATH=$PATH:$HOME/.local/bin
        yes | buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: NoteOrigin-Debug-APK
        path: bin/*.apk

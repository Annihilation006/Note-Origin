name: Build Note Origin APK

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Free Disk Space
      run: |
        echo "=== Before cleanup ==="
        df -h /
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/.ghcup
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo rm -rf /opt/hostedtoolcache/Ruby
        sudo rm -rf /opt/hostedtoolcache/node
        sudo rm -rf /opt/hostedtoolcache/go
        sudo apt-get clean
        echo "=== After cleanup ==="
        df -h /

    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git python3-dev ffmpeg \
          libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
          libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev \
          zlib1g-dev libgstreamer1.0-dev libunwind-dev unzip wget curl jq \
          libcurl4-openssl-dev pkg-config python3-lldb-13 lld

    - name: Setup Swift 6.3 Host Toolchain
      run: |
        curl -L -O https://download.swift.org/swiftly/linux/swiftly-x86_64.tar.gz
        tar zxf swiftly-x86_64.tar.gz
        ./swiftly init --skip-install --quiet-shell-followup --no-modify-profile

        echo "$HOME/.local/bin" >> $GITHUB_PATH
        echo "$HOME/.local/share/swiftly/bin" >> $GITHUB_PATH
        export PATH="$HOME/.local/bin:$PATH"
        source "$HOME/.local/share/swiftly/env.sh"

        swiftly install 6.3-DEVELOPMENT-SNAPSHOT-2026-01-03-a --assume-yes
        swiftly use 6.3-DEVELOPMENT-SNAPSHOT-2026-01-03-a

        swift --version
        df -h /

    - name: Build Swift Core (Aligned Toolchain)
      run: |
        set -euo pipefail
        export PATH="$HOME/.local/bin:$PATH"
        source "$HOME/.local/share/swiftly/env.sh"

        wget -q https://download.swift.org/swift-6.3-branch/android-sdk/swift-6.3-DEVELOPMENT-SNAPSHOT-2026-01-03-a/swift-6.3-DEVELOPMENT-SNAPSHOT-2026-01-03-a_android.artifactbundle.tar.gz
        mkdir -p sdk-temp
        tar -zxf swift-6.3-DEVELOPMENT-SNAPSHOT-2026-01-03-a_android.artifactbundle.tar.gz -C sdk-temp
        rm swift-6.3-DEVELOPMENT-SNAPSHOT-2026-01-03-a_android.artifactbundle.tar.gz

        SETUP_SCRIPT=$(find "$PWD/sdk-temp" -name "setup-android-sdk.sh" | head -n 1)
        if [ -z "$SETUP_SCRIPT" ]; then
          echo "ERROR: setup-android-sdk.sh not found!" && exit 1
        fi
        REAL_SDK_PATH=$(dirname "$(dirname "$SETUP_SCRIPT")")
        echo "SDK path: $REAL_SDK_PATH"

        chmod +x "$SETUP_SCRIPT"
        bash "$SETUP_SCRIPT" "$ANDROID_NDK_LATEST_HOME"

        SWIFT_LIB_DIR="$REAL_SDK_PATH/swift-resources/usr/lib/swift-aarch64/android"

        # swiftrt.o 软链接
        mkdir -p "$REAL_SDK_PATH/usr/lib/swift/android/aarch64"
        ln -sf \
          "$REAL_SDK_PATH/ndk-sysroot/usr/lib/swift/android/aarch64/swiftrt.o" \
          "$REAL_SDK_PATH/usr/lib/swift/android/aarch64/swiftrt.o"

        # libclang_rt 和 libunwind 软链接
        SWIFT_CLANG_LIB="$HOME/.local/share/swiftly/toolchains/6.3-snapshot-2026-01-03/usr/lib/clang/21/lib/aarch64-unknown-linux-android31"
        mkdir -p "$SWIFT_CLANG_LIB"
        NDK_PREBUILT="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64"
        NDK_BUILTINS=$(find "$NDK_PREBUILT" -name "libclang_rt.builtins-aarch64-android.a" 2>/dev/null | head -n 1)
        NDK_UNWIND=$(find "$NDK_PREBUILT" -name "libunwind.a" | grep aarch64 | head -n 1)
        ln -sf "$NDK_BUILTINS" "$SWIFT_CLANG_LIB/libclang_rt.builtins.a"
        ln -sf "$NDK_UNWIND" "$SWIFT_CLANG_LIB/libunwind.a"

        NDK_LLD="$NDK_PREBUILT/bin/ld.lld"

        swiftc -emit-library \
          -target aarch64-unknown-linux-android31 \
          -sdk "$REAL_SDK_PATH" \
          -I "$SWIFT_LIB_DIR" \
          -L "$SWIFT_LIB_DIR" \
          -use-ld="$NDK_LLD" \
          core/Logic.swift \
          -o liblogic.so

        cp "$SWIFT_LIB_DIR"/lib*.so .

        # Swift 运行时依赖 NDK 的 libc++_shared.so，一并拷出来
        LIBCXX=$(find "$NDK_PREBUILT/sysroot" -name "libc++_shared.so" | grep aarch64 | head -n 1 || true)
        if [ -n "$LIBCXX" ]; then
          cp "$LIBCXX" .
        else
          echo "WARN: libc++_shared.so not found in NDK"
        fi

        # 删除用不到的架构，节省空间
        rm -rf "$REAL_SDK_PATH/swift-resources/usr/lib/swift-armv7" \
               "$REAL_SDK_PATH/swift-resources/usr/lib/swift-x86_64" \
               "$REAL_SDK_PATH/swift-resources/usr/lib/swift_static-"*

        echo "=== Built files ==="
        ls -la *.so
        echo "Swift 6.3 Core Built Success!"

    - name: Check Swift lib dependencies
      run: |
        echo "=== liblogic.so NEEDED ==="
        readelf -d liblogic.so | grep NEEDED || true

        echo "=== Missing dependencies ==="
        SYSTEM_LIBS=" libc.so libm.so libdl.so liblog.so libz.so libandroid.so libEGL.so libGLESv2.so libOpenSLES.so libnativewindow.so libjnigraphics.so "
        for f in *.so; do
          for dep in $(readelf -d "$f" 2>/dev/null | sed -n 's/.*(NEEDED).*\[\(.*\)\].*/\1/p'); do
            [ -f "$dep" ] && continue
            case "$SYSTEM_LIBS" in *" $dep "*) continue ;; esac
            echo "MISSING: $dep (needed by $f)"
          done
        done
        echo "=== Check done ==="

    - name: Upload Swift libs
      uses: actions/upload-artifact@v4
      with:
        name: swift-libs-arm64
        path: "*.so"

    - name: Build with Buildozer
      run: |
        pip install --user buildozer cython==3.0.11
        export PATH=$PATH:$HOME/.local/bin
        yes | buildozer android debug

    - name: Verify Swift libs in APK
      run: |
        APK=$(ls bin/*.apk | head -n 1)
        echo "APK: $APK"
        unzip -l "$APK" | grep -E "liblogic|libswift|libFoundation|libdispatch|libBlocks|libc\+\+_shared" \
          || echo "!!! Swift libs NOT found in APK"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: NoteOrigin-Debug-APK
        path: bin/*.apk

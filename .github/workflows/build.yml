name: Build Note Origin APK

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git python3-dev ffmpeg \
          libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
          libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev \
          zlib1g-dev libgstreamer1.0-dev libunwind-dev unzip wget curl jq

    - name: Setup Swiftly
      run: |
        curl -L -O https://download.swift.org/swiftly/linux/swiftly-x86_64.tar.gz
        tar zxf swiftly-x86_64.tar.gz
        ./swiftly init --quiet-shell-followup --no-modify-profile
        echo "$HOME/.local/bin" >> $GITHUB_PATH
        echo "$HOME/.local/share/swiftly/bin" >> $GITHUB_PATH
        export PATH="$HOME/.local/bin:$PATH"
        source "$HOME/.local/share/swiftly/env.sh"
        swiftly install latest --assume-yes

    - name: Manual Setup Android SDK & NDK
      run: |
        # 1. 下载 NDK r27d
        wget -q https://dl.google.com/android/repository/android-ndk-r27d-linux.zip
        unzip -q android-ndk-r27d-linux.zip
        echo "NDK_PATH=$PWD/android-ndk-r27d" >> $GITHUB_ENV

        # 2. 手动下载并解压 Android SDK Bundle (跳过 swift sdk install 的黑盒)
        # 我们直接把 tar.gz 解压到本地目录
        wget -q https://download.swift.org/swift-6.3-branch/android-sdk/swift-6.3-DEVELOPMENT-SNAPSHOT-2026-01-03-a/swift-6.3-DEVELOPMENT-SNAPSHOT-2026-01-03-a_android.artifactbundle.tar.gz
        mkdir -p my-swift-sdk
        tar -zxf swift-6.3-DEVELOPMENT-SNAPSHOT-2026-01-03-a_android.artifactbundle.tar.gz -C my-swift-sdk
        
        # 3. 定位内部真正的 .sdk 文件夹
        # 在 artifactbundle 模式下，它通常在：artifacts/SDK名称/内部/usr
        REAL_SDK=$(find $PWD/my-swift-sdk -name "*.sdk" -type d | head -n 1)
        echo "LOCKED_SDK_PATH=$REAL_SDK" >> $GITHUB_ENV
        
        # 4. 运行 setup 脚本链接 NDK
        SETUP_SCRIPT=$(find $PWD/my-swift-sdk -name "setup-android-sdk.sh" | head -n 1)
        chmod +x "$SETUP_SCRIPT"
        bash "$SETUP_SCRIPT" "$PWD/android-ndk-r27d"
        echo "SDK & NDK 物理链接完成"

    - name: Build Swift Kernel (liblogic.so)
      run: |
        source "$HOME/.local/share/swiftly/env.sh"
        export PATH="$HOME/.local/bin:$PATH"
        
        echo "Using Path: $LOCKED_SDK_PATH"

        # 使用最底层的 -sdk 标志，直接指向我们手动解压的路径
        swiftc -emit-library \
          -target aarch64-unknown-linux-android31 \
          -sdk "$LOCKED_SDK_PATH" \
          -I "$LOCKED_SDK_PATH/usr/lib/swift/android" \
          -L "$LOCKED_SDK_PATH/usr/lib/swift/android/aarch64" \
          core/Logic.swift \
          -o liblogic.so
        
        # 物理拷贝库文件
        SWIFT_LIB="$LOCKED_SDK_PATH/usr/lib/swift/android/aarch64"
        cp $SWIFT_LIB/libswiftCore.so .
        cp $SWIFT_LIB/libswiftGlibc.so .
        cp $SWIFT_LIB/libswiftDispatch.so .
        cp $SWIFT_LIB/libswift_Concurrency.so .
        cp $SWIFT_LIB/libFoundation.so .

    - name: Build with Buildozer
      run: |
        pip install --user --upgrade buildozer cython
        export PATH=$PATH:$HOME/.local/bin
        yes | buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: NoteOrigin-Debug-APK
        path: bin/*.apk

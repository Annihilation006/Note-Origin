name: Build Note Origin APK

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git python3-dev ffmpeg \
          libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
          libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev \
          zlib1g-dev libgstreamer1.0-dev libunwind-dev unzip wget curl

    - name: Setup Swift SDK (Stable Release Method)
      run: |
        # 1. 使用官方 6.0.2 正式版链接（Ubuntu 22.04 专用）
        wget https://download.swift.org/swift-6.0.2-release/ubuntu2204/swift-6.0.2-RELEASE/swift-6.0.2-RELEASE-ubuntu22.04.tar.gz
        tar -xzf swift-6.0.2-RELEASE-ubuntu22.04.tar.gz
        
        # 2. 将 Swift 工具链路径加入系统路径
        echo "$GITHUB_WORKSPACE/swift-6.0.2-RELEASE-ubuntu22.04/usr/bin" >> $GITHUB_PATH
        
        # 3. 使用正式版 Android SDK 扩展包链接
        wget https://download.swift.org/swift-6.0.2-release/android-24/swift-6.0.2-RELEASE-android-24-sdk.artifactbundle.tar.gz
        ./swift-6.0.2-RELEASE-ubuntu22.04/usr/bin/swift sdk install swift-6.0.2-RELEASE-android-24-sdk.artifactbundle.tar.gz

    - name: Install Android NDK r27d
      run: |
        mkdir -p ~/android-ndk
        cd ~/android-ndk
        wget https://dl.google.com/android/repository/android-ndk-r27d-linux.zip
        unzip -q android-ndk-r27d-linux.zip
        echo "ANDROID_NDK_HOME=$HOME/android-ndk/android-ndk-r27d" >> $GITHUB_ENV

    - name: Build Swift Kernel (liblogic.so)
      run: |
        # 显式调用解压出来的编译器
        export PATH="$GITHUB_WORKSPACE/swift-6.0.2-RELEASE-ubuntu22.04/usr/bin:$PATH"
        
        # 获取正式版 SDK ID
        SDK_ID=$(swift sdk list | grep android | head -n 1 | awk '{print $1}')
        
        # 编译核心库
        swiftc -emit-library -target aarch64-unknown-linux-android31 -swift-sdk $SDK_ID core/Logic.swift -o liblogic.so
        
        # 拷贝运行时库（注意路径必须对应 6.0.2 版本）
        SWIFT_LIB_DIR=$GITHUB_WORKSPACE/swift-6.0.2-RELEASE-ubuntu22.04/usr/lib/swift/android/aarch64
        cp $SWIFT_LIB_DIR/libswiftCore.so .
        cp $SWIFT_LIB_DIR/libswiftGlibc.so .
        cp $SWIFT_LIB_DIR/libswiftDispatch.so .
        cp $SWIFT_LIB_DIR/libswift_Concurrency.so .
        cp $SWIFT_LIB_DIR/libFoundation.so .

    - name: Build APK with Buildozer
      run: |
        pip install --user --upgrade buildozer cython
        export PATH=$PATH:$HOME/.local/bin
        # 自动打包开始
        yes | buildozer android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NoteOrigin-Debug-APK
        path: bin/*.apk

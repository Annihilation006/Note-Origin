name: Build Note Origin APK

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Swiftly (Official 2026 Tar.gz Method)
      run: |
        # 下载官方 swiftly 二进制（x86_64 为 ubuntu）
        curl -O https://download.swift.org/swiftly/linux/swiftly-x86_64.tar.gz
        
        # 解压并非交互初始化
        tar zxf swiftly-x86_64.tar.gz
        ./swiftly init --quiet-shell-followup --no-modify-profile
        
        # 加载环境（关键）
        source ~/.local/share/swiftly/env.sh
        
        # 添加 PATH 保险
        echo "$HOME/.local/bin" >> $GITHUB_PATH
        echo "$HOME/.local/share/swiftly/bin" >> $GITHUB_PATH

    - name: Install Latest Android Swift SDK Bundle
      run: |
        source ~/.local/share/swiftly/env.sh
        
        # 2026-01-05 附近最新 nightly Android bundle（官方永久路径格式）
        # 如果 404，换成最新日期如 2026-01-04-a 或查看 swift.org/download 最新 snapshot
        ANDROID_BUNDLE="https://download.swift.org/development/android-sdk/swift-DEVELOPMENT-SNAPSHOT-2026-01-03-a/swift-DEVELOPMENT-SNAPSHOT-2026-01-03-a_android.artifactbundle.tar.gz"
        
        swift sdk install $ANDROID_BUNDLE

    - name: Build Swift Kernel (liblogic.so)
      run: |
        source ~/.local/share/swiftly/env.sh
        
        # 获取 Android SDK ID
        SDK_ID=$(swift sdk list | grep android | head -n 1 | awk '{print $1}')
        echo "Using Android SDK: $SDK_ID"
        
        if [ -z "$SDK_ID" ]; then
          echo "::error ::No Android SDK found!"
          swift sdk list
          exit 1
        fi

        # 编译共享库（target android31 兼容）
        swiftc -emit-library -target aarch64-unknown-linux-android31 -swift-sdk $SDK_ID core/Logic.swift -o liblogic.so

        # 动态拷贝运行时库
        SWIFT_LIB=$(swift --print-target-info --swift-sdk $SDK_ID | jq -r '.paths.runtimeLibraryPaths[0]')/aarch64
        echo "Runtime lib path: $SWIFT_LIB"

        cp $SWIFT_LIB/libswiftCore.so .
        cp $SWIFT_LIB/libswiftGlibc.so .
        cp $SWIFT_LIB/libswiftDispatch.so .
        cp $SWIFT_LIB/libswift_Concurrency.so .
        cp $SWIFT_LIB/libFoundation.so .

        echo "Swift 内核 + 运行时库全员到齐！"

    - name: Install Buildozer Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-pip build-essential git python3-dev ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev libgstreamer1.0-dev openjdk-17-jdk-headless jq
        pip install --user --upgrade buildozer cython

    - name: Build with Buildozer
      run: |
        export PATH=$PATH:$HOME/.local/bin
        yes | buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: NoteOrigin-Debug-APK
        path: bin/*.apk

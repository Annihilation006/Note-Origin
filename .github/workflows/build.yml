name: Build Note Origin APK

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install System Dependencies (with libunwind fix)
      run: |
        sudo apt-get update
        # 修复 libgstreamer1.0-dev 依赖冲突
        sudo apt-get remove -y libunwind-* || true
        sudo apt-get autoremove -y || true
        
        sudo apt-get install -y \
          build-essential git python3-dev ffmpeg \
          libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
          libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev \
          zlib1g-dev libgstreamer1.0-dev \
          unzip wget curl

    - name: Install Swiftly (Official Latest Method)
      run: |
        curl -fL -O https://download.swift.org/swiftly/linux/swiftly-x86_64.tar.gz
        tar zxf swiftly-x86_64.tar.gz
        ./swiftly init --quiet-shell-followup
        echo "$HOME/.local/bin" >> $GITHUB_PATH
        source ~/.local/share/swiftly/env.bash || true

    - name: Install Latest Swift Toolchain
      run: |
        swiftly install latest

    - name: Install Android NDK r27d
      run: |
        mkdir -p ~/android-ndk
        cd ~/android-ndk
        wget https://dl.google.com/android/repository/android-ndk-r27d-linux.zip
        unzip -q android-ndk-r27d-linux.zip
        echo "ANDROID_NDK_HOME=$HOME/android-ndk/android-ndk-r27d" >> $GITHUB_ENV

    - name: Install Swift Android SDK Bundle
      run: |
        # 注意：运行前从 https://swift.org/download/ 复制当天最新 install 命令替换这里
        swift sdk install https://download.swift.org/development/android-sdk/swift-DEVELOPMENT-SNAPSHOT-2026-01-05-a/swift-DEVELOPMENT-SNAPSHOT-2026-01-05-a_android.artifactbundle.tar.gz
        SDK_ID=$(swift sdk list | grep android | awk '{print $1}' || echo "")
        if [ -n "$SDK_ID" ]; then
          ~/.swiftpm/swift-sdks/$SDK_ID/setup-android-sdk.sh --ndk $ANDROID_NDK_HOME
        fi

    - name: Build Swift Kernel
      run: |
        cd core || exit 1
        SDK_ID=$(swift sdk list | grep android | awk '{print $1}')
        swiftc -emit-library -target aarch64-unknown-linux-android31 -swift-sdk $SDK_ID Logic.swift -o ../liblogic.so
        
        SWIFT_LIB=$(dirname $(which swift))/../lib/swift/android/aarch64
        mkdir -p ../
        cp $SWIFT_LIB/libswift*.so ../

    - name: Install Buildozer
      run: |
        pip install --user --upgrade buildozer cython==0.29.33  # 老版本更稳定

    - name: Build APK
      run: |
        buildozer init || true
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: NoteOrigin-APK
        path: bin/*.apk

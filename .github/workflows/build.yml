name: Build Note Origin APK

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git python3-dev ffmpeg \
          libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
          libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev \
          zlib1g-dev libgstreamer1.0-dev libunwind-dev unzip wget curl jq

    - name: Setup Swiftly
      run: |
        curl -L -O https://download.swift.org/swiftly/linux/swiftly-x86_64.tar.gz
        tar zxf swiftly-x86_64.tar.gz
        ./swiftly init --quiet-shell-followup --no-modify-profile
        echo "$HOME/.local/bin" >> $GITHUB_PATH
        echo "$HOME/.local/share/swiftly/bin" >> $GITHUB_PATH

    - name: Build Swift Core (Manual SDK/NDK Link)
      run: |
        # 1. 立即加载 Swift 环境
        export PATH="$HOME/.local/bin:$PATH"
        source "$HOME/.local/share/swiftly/env.sh"
        swiftly install latest --assume-yes

        # 2. 下载并解压 NDK r27d
        wget -q https://dl.google.com/android/repository/android-ndk-r27d-linux.zip
        unzip -q android-ndk-r27d-linux.zip
        NDK_ABS_PATH=$PWD/android-ndk-r27d

        # 3. 手动下载并解压 SDK Bundle
        wget -q https://download.swift.org/swift-6.3-branch/android-sdk/swift-6.3-DEVELOPMENT-SNAPSHOT-2026-01-03-a/swift-6.3-DEVELOPMENT-SNAPSHOT-2026-01-03-a_android.artifactbundle.tar.gz
        mkdir -p swift-sdk-root
        tar -zxf swift-6.3-DEVELOPMENT-SNAPSHOT-2026-01-03-a_android.artifactbundle.tar.gz -C swift-sdk-root
        
        # 4. 实时锁定路径 (不依赖外部环境变量)
        REAL_SDK_PATH=$(find $PWD/swift-sdk-root -name "*.sdk" -type d | head -n 1)
        SETUP_SCRIPT=$(find $PWD/swift-sdk-root -name "setup-android-sdk.sh" | head -n 1)
        
        echo "Found SDK at: $REAL_SDK_PATH"
        echo "Found Setup at: $SETUP_SCRIPT"

        # 5. 执行 NDK 链接
        chmod +x "$SETUP_SCRIPT"
        bash "$SETUP_SCRIPT" "$NDK_ABS_PATH"

        # 6. 立即执行编译 (同一进程内，变量绝对有效)
        swiftc -emit-library \
          -target aarch64-unknown-linux-android31 \
          -sdk "$REAL_SDK_PATH" \
          -I "$REAL_SDK_PATH/usr/lib/swift/android" \
          -L "$REAL_SDK_PATH/usr/lib/swift/android/aarch64" \
          core/Logic.swift \
          -o liblogic.so
        
        # 7. 拷贝库文件
        SWIFT_LIB="$REAL_SDK_PATH/usr/lib/swift/android/aarch64"
        cp $SWIFT_LIB/libswiftCore.so .
        cp $SWIFT_LIB/libswiftGlibc.so .
        cp $SWIFT_LIB/libswiftDispatch.so .
        cp $SWIFT_LIB/libswift_Concurrency.so .
        cp $SWIFT_LIB/libFoundation.so .
        
        echo "Successfully built liblogic.so and copied runtime libraries."

    - name: Build with Buildozer
      run: |
        pip install --user --upgrade buildozer cython
        export PATH=$PATH:$HOME/.local/bin
        # 确保 Buildozer 能看到我们刚才生成的 .so 文件
        yes | buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: NoteOrigin-Debug-APK
        path: bin/*.apk

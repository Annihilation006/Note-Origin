name: Build Note Origin APK

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # 修正了這裡的橫槓

    - name: Install Swift Android SDK
      run: |
        # 增加 -L 和 -f 參數來確保穩定下載，並換一個更穩定的官方連結
        curl -fL https://swiftlang.github.io/swiftly/swiftly-install.sh | bash -s -- -y
        export PATH="$HOME/.local/bin:$PATH"
        source $HOME/.bashrc
        
        # 修正下載連結：使用 2024 年底最穩定的 release 版，避免 snapshot 連結失效
        swiftly install latest
        swift sdk install https://download.swift.org/swift-6.0.2-release/android-24/swift-6.0.2-RELEASE-android-24-sdk.artifactbundle.tar.gz

    - name: Build Swift Kernel (liblogic.so)
      run: |
        export PATH="$HOME/.local/bin:$PATH"
        # 這裡增加了一個自動尋找路徑的容錯
        SDK_ID=$(swift sdk list | grep android | head -n 1 | awk '{print $1}')
        swiftc -emit-library -target aarch64-unknown-linux-android31 -swift-sdk $SDK_ID core/Logic.swift -o liblogic.so
        
        # 拷貝運行庫
        SWIFT_LIB=$(dirname $(which swift))/../lib/swift/android/aarch64
        cp $SWIFT_LIB/libswiftCore.so .
        cp $SWIFT_LIB/libswiftGlibc.so .
        cp $SWIFT_LIB/libswiftDispatch.so .
        cp $SWIFT_LIB/libswift_Concurrency.so .
        cp $SWIFT_LIB/libFoundation.so .

    - name: Install Buildozer Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-pip build-essential git python3-dev ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev libgstreamer1.0-dev
        pip install --user --upgrade buildozer cython

    - name: Build with Buildozer
      run: |
        export PATH=$PATH:$HOME/.local/bin
        # 自動接受協議並啟動編譯
        yes | buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: NoteOrigin-Debug-APK
        path: bin/*.apk

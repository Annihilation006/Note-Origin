name: Build Note Origin APK

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git python3-dev ffmpeg \
          libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
          libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev \
          zlib1g-dev libgstreamer1.0-dev libunwind-dev unzip wget curl jq

    - name: Setup Swiftly and Android SDK
      run: |
        # 1. 安装 Swiftly (非交互模式)
        curl -L -O https://download.swift.org/swiftly/linux/swiftly-x86_64.tar.gz
        tar zxf swiftly-x86_64.tar.gz
        ./swiftly init --quiet-shell-followup --no-modify-profile
        
        echo "$HOME/.local/bin" >> $GITHUB_PATH
        echo "$HOME/.local/share/swiftly/bin" >> $GITHUB_PATH
        
        export PATH="$HOME/.local/bin:$PATH"
        source "$HOME/.local/share/swiftly/env.sh"
        
        swiftly install latest --assume-yes
        
        # 2. 安装 Android SDK (带 Checksum 验证)
        swift sdk install \
          https://download.swift.org/swift-6.3-branch/android-sdk/swift-6.3-DEVELOPMENT-SNAPSHOT-2026-01-03-a/swift-6.3-DEVELOPMENT-SNAPSHOT-2026-01-03-a_android.artifactbundle.tar.gz \
          --checksum ca7cc00ca7483cbb8b2005f864d33975177c8d2ca34d59ac841c9545916c302f

    - name: Setup Android NDK r27d
      run: |
        # 3. 稳健下载 NDK
        wget -q https://dl.google.com/android/repository/android-ndk-r27d-linux.zip
        unzip -q android-ndk-r27d-linux.zip
        NDK_PATH=$PWD/android-ndk-r27d
        
        # 4. 【核心修改】在地毯式搜索 setup 脚本 (解决 No such file or directory)
        # 不再写死 .local 路径，直接从 $HOME 开始找
        echo "Searching for setup-android-sdk.sh in $HOME..."
        SETUP_SCRIPT=$(find $HOME -name "setup-android-sdk.sh" | head -n 1)
        
        if [ -z "$SETUP_SCRIPT" ]; then
          echo "::error::地毯式搜索失败！Swift SDK 可能未正确解压。"
          # 打印当前目录结构辅助调试
          find $HOME -maxdepth 4 -type d
          exit 1
        fi
        
        echo "Found script at: $SETUP_SCRIPT"
        # 赋予执行权限并运行
        chmod +x "$SETUP_SCRIPT"
        bash "$SETUP_SCRIPT" "$NDK_PATH"

    - name: Build Swift Kernel (liblogic.so)
      run: |
        [ -f "$HOME/.local/share/swiftly/env.sh" ] && source "$HOME/.local/share/swiftly/env.sh"
        export PATH="$HOME/.local/bin:$PATH"
        
        SDK_ID=$(swift sdk list | grep android | head -n 1 | awk '{print $1}')
        
        # 使用修正后的双横杠参数
        swiftc -emit-library \
          -target aarch64-unknown-linux-android31 \
          --swift-sdk $SDK_ID \
          core/Logic.swift \
          -o liblogic.so
        
        # 提取运行时库
        SWIFT_LIB=$(swift --print-target-info --swift-sdk $SDK_ID | jq -r '.paths.runtimeLibraryPaths[0]')/aarch64
        cp $SWIFT_LIB/libswiftCore.so .
        cp $SWIFT_LIB/libswiftGlibc.so .
        cp $SWIFT_LIB/libswiftDispatch.so .
        cp $SWIFT_LIB/libswift_Concurrency.so .
        cp $SWIFT_LIB/libFoundation.so .

    - name: Build with Buildozer
      run: |
        pip install --user --upgrade buildozer cython
        export PATH=$PATH:$HOME/.local/bin
        yes | buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: NoteOrigin-Debug-APK
        path: bin/*.apk

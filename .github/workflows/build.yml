name: Build Note Origin APK

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git python3-dev ffmpeg \
          libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
          libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev \
          zlib1g-dev libgstreamer1.0-dev libunwind-dev unzip wget curl jq \
          libcurl4-openssl-dev pkg-config python3-lldb-13 lld

    - name: Setup Swift 6.3 Host Toolchain
      run: |
        curl -L -O https://download.swift.org/swiftly/linux/swiftly-x86_64.tar.gz
        tar zxf swiftly-x86_64.tar.gz
        ./swiftly init --quiet-shell-followup --no-modify-profile

        echo "$HOME/.local/bin" >> $GITHUB_PATH
        echo "$HOME/.local/share/swiftly/bin" >> $GITHUB_PATH
        export PATH="$HOME/.local/bin:$PATH"
        source "$HOME/.local/share/swiftly/env.sh"

        swiftly install 6.3-DEVELOPMENT-SNAPSHOT-2026-01-03-a --assume-yes || true
        swiftly use 6.3-DEVELOPMENT-SNAPSHOT-2026-01-03-a

        swift --version

    - name: Build Swift Core (Aligned Toolchain)
      run: |
        set -euo pipefail
        export PATH="$HOME/.local/bin:$PATH"
        source "$HOME/.local/share/swiftly/env.sh"

        wget -q https://download.swift.org/swift-6.3-branch/android-sdk/swift-6.3-DEVELOPMENT-SNAPSHOT-2026-01-03-a/swift-6.3-DEVELOPMENT-SNAPSHOT-2026-01-03-a_android.artifactbundle.tar.gz
        mkdir -p sdk-temp
        tar -zxf swift-6.3-DEVELOPMENT-SNAPSHOT-2026-01-03-a_android.artifactbundle.tar.gz -C sdk-temp

        SETUP_SCRIPT=$(find "$PWD/sdk-temp" -name "setup-android-sdk.sh" | head -n 1)
        if [ -z "$SETUP_SCRIPT" ]; then
          echo "ERROR: setup-android-sdk.sh not found!" && exit 1
        fi
        REAL_SDK_PATH=$(dirname "$(dirname "$SETUP_SCRIPT")")
        echo "SDK path: $REAL_SDK_PATH"

        chmod +x "$SETUP_SCRIPT"
        bash "$SETUP_SCRIPT" "$ANDROID_NDK_LATEST_HOME"

        SWIFT_LIB_DIR="$REAL_SDK_PATH/swift-resources/usr/lib/swift-aarch64/android"

        # swiftrt.o 软链接
        mkdir -p "$REAL_SDK_PATH/usr/lib/swift/android/aarch64"
        ln -sf \
          "$REAL_SDK_PATH/ndk-sysroot/usr/lib/swift/android/aarch64/swiftrt.o" \
          "$REAL_SDK_PATH/usr/lib/swift/android/aarch64/swiftrt.o"

        # NDK lld
        NDK_LLD="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/ld.lld"

        # swiftc 去 toolchain 的 clang/21/lib/aarch64-unknown-linux-android31/ 找库
        # 但实际在 NDK 里，建软链接补上
        SWIFT_CLANG_LIB="$HOME/.local/share/swiftly/toolchains/6.3-snapshot-2026-01-03/usr/lib/clang/21/lib/aarch64-unknown-linux-android31"
        mkdir -p "$SWIFT_CLANG_LIB"

        NDK_PREBUILT="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64"

        # libclang_rt.builtins.a
        NDK_BUILTINS=$(find "$NDK_PREBUILT/lib" -name "libclang_rt.builtins-aarch64-android.a" 2>/dev/null | head -n 1)
        if [ -z "$NDK_BUILTINS" ]; then
          NDK_BUILTINS=$(find "$NDK_PREBUILT" -name "libclang_rt.builtins*.a" | grep aarch64 | head -n 1)
        fi
        echo "builtins: $NDK_BUILTINS"
        ln -sf "$NDK_BUILTINS" "$SWIFT_CLANG_LIB/libclang_rt.builtins.a"

        # libunwind.a
        NDK_UNWIND=$(find "$NDK_PREBUILT" -name "libunwind.a" | grep aarch64 | head -n 1)
        echo "unwind: $NDK_UNWIND"
        ln -sf "$NDK_UNWIND" "$SWIFT_CLANG_LIB/libunwind.a"

        swiftc -emit-library \
          -target aarch64-unknown-linux-android31 \
          -sdk "$REAL_SDK_PATH" \
          -I "$SWIFT_LIB_DIR" \
          -L "$SWIFT_LIB_DIR" \
          -use-ld="$NDK_LLD" \
          core/Logic.swift \
          -o liblogic.so

        cp "$SWIFT_LIB_DIR"/lib*.so .

        echo "=== Built files ==="
        ls *.so
        echo "Swift 6.3 Core Built Success!"

    - name: Build with Buildozer
      run: |
        pip install --user buildozer cython==3.0.11
        export PATH=$PATH:$HOME/.local/bin
        yes | buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: NoteOrigin-Debug-APK
        path: bin/*.apk
